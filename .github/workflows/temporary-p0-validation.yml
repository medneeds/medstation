name: Temporary P0 validation

on:
  push:
    branches:
      - audit/trial-entitlement-p0

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (disposable)
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
