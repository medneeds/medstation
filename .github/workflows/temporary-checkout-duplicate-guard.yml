name: Temporary checkout duplicate subscription guard

on:
  push:
    branches:
      - audit/trial-entitlement-p0

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[checkout-duplicate-guard]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trial-entitlement-p0
          fetch-depth: 0

      - name: Add duplicate subscription protection
        shell: python
        run: |
          from pathlib import Path

          for filename, guest in [
            ('supabase/functions/create-checkout/index.ts', False),
            ('supabase/functions/guest-checkout/index.ts', True),
          ]:
            p = Path(filename)
            text = p.read_text()

            if guest:
              old = '''    const customers = await stripe.customers.list({ email, limit: 1 });\n    const customerId = customers.data.length > 0 ? customers.data[0].id : undefined;\n\n    const origin = req.headers.get("origin") || "https://medstation.ai";'''
              new = '''    const customers = await stripe.customers.list({ email, limit: 1 });\n    const customerId = customers.data.length > 0 ? customers.data[0].id : undefined;\n\n    if (customerId) {\n      const existingSubs = await stripe.subscriptions.list({ customer: customerId, status: "all", limit: 20 });\n      const existingActive = existingSubs.data.find((s) => ["active", "trialing", "past_due"].includes(s.status));\n      if (existingActive) {\n        return new Response(\n          JSON.stringify({\n            error: "Já existe uma assinatura ativa para este e-mail. Entre na sua conta para continuar.",\n            code: "EXISTING_SUBSCRIPTION",\n          }),\n          { status: 409, headers: { ...corsHeaders, "Content-Type": "application/json" } },\n        );\n      }\n    }\n\n    const origin = req.headers.get("origin") || "https://medstation.ai";'''
            else:
              old = '''    const customers = await stripe.customers.list({ email: user.email, limit: 1 });\n    const customerId = customers.data.length > 0 ? customers.data[0].id : undefined;\n\n    const sessionConfig: any = {'''
              new = '''    const customers = await stripe.customers.list({ email: user.email, limit: 1 });\n    const customerId = customers.data.length > 0 ? customers.data[0].id : undefined;\n\n    if (customerId) {\n      const existingSubs = await stripe.subscriptions.list({ customer: customerId, status: "all", limit: 20 });\n      const existingActive = existingSubs.data.find((s) => ["active", "trialing", "past_due"].includes(s.status));\n      if (existingActive) {\n        return new Response(\n          JSON.stringify({\n            error: "Sua conta já possui uma assinatura ativa.",\n            code: "EXISTING_SUBSCRIPTION",\n          }),\n          { status: 409, headers: { ...corsHeaders, "Content-Type": "application/json" } },\n        );\n      }\n    }\n\n    const sessionConfig: any = {'''

            assert text.count(old) == 1, f'Unexpected insertion anchor in {filename}'
            p.write_text(text.replace(old, new, 1))

      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected=$'supabase/functions/create-checkout/index.ts\nsupabase/functions/guest-checkout/index.ts'
          test "$changed" = "$expected"
          git diff --check
          grep -F 'EXISTING_SUBSCRIPTION' supabase/functions/create-checkout/index.ts
          grep -F 'EXISTING_SUBSCRIPTION' supabase/functions/guest-checkout/index.ts

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/create-checkout/index.ts supabase/functions/guest-checkout/index.ts
          git commit -m "[checkout-duplicate-guard] Prevent duplicate active subscriptions"
          git push origin HEAD:audit/trial-entitlement-p0
