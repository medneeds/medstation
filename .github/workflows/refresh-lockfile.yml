name: Refresh Lockfile

on:
  push:
    branches: [chore/repository-reproducibility-hardening]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/repository-reproducibility-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit package-lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git commit -m "chore: synchronize package-lock"
          git push origin HEAD:chore/repository-reproducibility-hardening
