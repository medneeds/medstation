name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bunx vitest run

      - name: Verify Hermes MCP stdio bridge (offline)
        run: node --test hermes-bridge/server.test.mjs hermes-bridge/full-integration.test.mjs hermes-bridge/verify-hermes.test.mjs

      - name: Offline Hermes integration preflight
        run: node hermes-bridge/preflight.mjs

      - name: Build
        run: bun run build

  hermes-real-mcp:
    name: Hermes official CLI + MedStation MCP (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout MedStation PR
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup uv for isolated Hermes installation
        uses: astral-sh/setup-uv@v6

      - name: Download pinned official Hermes release
        shell: bash
        run: |
          git clone --depth 1 --branch v0.23.1 --single-branch https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          test "$(git -C /tmp/hermes-agent rev-parse HEAD)" = "3b421578588243f920886e6fe79a6faa87ea026e"

      - name: Install Hermes in disposable Python 3.14 environment
        working-directory: /tmp/hermes-agent
        shell: bash
        run: uv sync --frozen --python 3.14

      - name: Register MedStation's only synthetic MCP tool
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hermes-home"
          cat > "$RUNNER_TEMP/hermes-home/config.yaml" <<YAML
          mcp_servers:
            medstation_sandbox:
              command: "node"
              args: ["$GITHUB_WORKSPACE/hermes-bridge/server.mjs"]
              enabled: true
              trust: untrusted
              supports_parallel_tool_calls: false
              tools:
                include: ["medstation_simulate_admission"]
                resources: false
                prompts: false
          YAML

      - name: Verify Hermes official CLI discovers MedStation MCP
        shell: bash
        working-directory: /tmp/hermes-agent
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          MEDSTATION_MCP_STAGING_ENABLED: "false"
        run: |
          uv run --no-sync hermes --version
          uv run --no-sync hermes mcp list
          uv run --no-sync hermes mcp test medstation_sandbox

      - name: Confirm no clinical execution was possible
        run: node hermes-bridge/preflight.mjs
