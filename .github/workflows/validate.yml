name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bunx vitest run

      - name: Verify Hermes MCP stdio bridge (offline)
        run: node --test hermes-bridge/server.test.mjs hermes-bridge/full-integration.test.mjs hermes-bridge/verify-hermes.test.mjs

      - name: Offline Hermes integration preflight
        run: node hermes-bridge/preflight.mjs

      - name: Build
        run: bun run build
