name: Temporary final P0 build validation

on:
  push:
    branches:
      - audit/trial-entitlement-p0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies without persisting lockfile
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
