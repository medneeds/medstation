name: Temporary admin pricing cohort patch

on:
  push:
    branches:
      - audit/trial-entitlement-p0

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[admin-pricing-cohort]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trial-entitlement-p0
          fetch-depth: 0

      - name: Apply admin pricing cohort patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/functions/admin-list-subscribers/index.ts')
          text = path.read_text()

          anchor = '''const PRODUCT_LABELS: Record<string, string> = {\n  prod_V4jGKeBPH2hGYg: "MedStation Completo (49,90)",\n  prod_V4BACwTTBf5tBk: "Pro Completo (legado 99,90)",\n  prod_UUfw2uz4UPwkco: "Pro 2 Bundle (legado)",\n  prod_TgR7u5urUle7om: "Assistentes (legado 29,90)",\n  prod_UUfvAeta3d1Rn5: "Upgrade Assistentes (legado)",\n  prod_UUfuDkH9yfcfb3: "Modo Escuta (legado)",\n  prod_UUfu9AzBtaGsCW: "Upgrade Modo Escuta (legado)",\n};\n'''
          replacement = anchor + '''\nconst CURRENT_UNIFIED_PRODUCT_ID = "prod_V4jGKeBPH2hGYg";\nconst LEGACY_PRODUCT_IDS = new Set([\n  "prod_V4BACwTTBf5tBk",\n  "prod_UUfw2uz4UPwkco",\n  "prod_TgR7u5urUle7om",\n  "prod_UUfvAeta3d1Rn5",\n  "prod_UUfuDkH9yfcfb3",\n  "prod_UUfu9AzBtaGsCW",\n]);\n'''
          assert text.count(anchor) == 1, 'Unexpected product labels anchor count'
          text = text.replace(anchor, replacement, 1)

          old = '''    const [courtesyRes, rolesRes, profilesRes, accessRes] = await Promise.all([\n      supabaseAdmin.from("courtesy_access").select("*"),\n      supabaseAdmin.from("user_roles").select("user_id, role"),\n      supabaseAdmin.from("profiles").select("id, full_name, specialty, crm, crm_state, phone"),\n      supabaseAdmin.from("user_access").select("user_id, trial_started_at, trial_ends_at, trial_source"),\n    ]);'''
          new = '''    const [courtesyRes, rolesRes, profilesRes, accessRes, policyRes] = await Promise.all([\n      supabaseAdmin.from("courtesy_access").select("*"),\n      supabaseAdmin.from("user_roles").select("user_id, role"),\n      supabaseAdmin.from("profiles").select("id, full_name, specialty, crm, crm_state, phone"),\n      supabaseAdmin.from("user_access").select("user_id, trial_started_at, trial_ends_at, trial_source"),\n      supabaseAdmin.from("commercial_policy").select("legacy_full_access_until").eq("id", "medstation_unified_2026").maybeSingle(),\n    ]);'''
          assert text.count(old) == 1, 'Unexpected Promise.all anchor count'
          text = text.replace(old, new, 1)

          old = '''    const profilesMap = new Map((profilesRes.data || []).map((p: any) => [p.id, p]));\n    const accessMap = new Map((accessRes.data || []).map((a: any) => [a.user_id, a]));\n\n    const { customers, customersById, subscriptionsByCustomer } = await fetchAllStripeData(stripe, refresh);'''
          new = '''    const profilesMap = new Map((profilesRes.data || []).map((p: any) => [p.id, p]));\n    const accessMap = new Map((accessRes.data || []).map((a: any) => [a.user_id, a]));\n    const legacyFullAccessUntil: string | null = policyRes.data?.legacy_full_access_until || null;\n\n    const { customers, customersById, subscriptionsByCustomer } = await fetchAllStripeData(stripe, refresh);'''
          assert text.count(old) == 1, 'Unexpected maps anchor count'
          text = text.replace(old, new, 1)

          old = '''      const entitlement = u ? accessMap.get(u.id) : null;\n      const paying = PAYING_STATUSES.has(stripe.status);\n\n      const trialStartedAt: string | null = entitlement?.trial_started_at || null;'''
          new = '''      const entitlement = u ? accessMap.get(u.id) : null;\n      const paying = PAYING_STATUSES.has(stripe.status);\n      const hasCurrentUnified = stripe.productIds.includes(CURRENT_UNIFIED_PRODUCT_ID);\n      const hasLegacyProduct = stripe.productIds.some((id) => LEGACY_PRODUCT_IDS.has(id));\n      const pricingCohort = paying\n        ? hasCurrentUnified\n          ? "current_unified"\n          : hasLegacyProduct\n            ? "legacy_pre_unification"\n            : null\n        : null;\n      const legacyProtectionUntil = pricingCohort === "legacy_pre_unification" ? legacyFullAccessUntil : null;\n      const pricingReviewDue = !!legacyProtectionUntil && new Date(legacyProtectionUntil).getTime() <= Date.now();\n\n      const trialStartedAt: string | null = entitlement?.trial_started_at || null;'''
          assert text.count(old) == 1, 'Unexpected buildRecord pricing anchor count'
          text = text.replace(old, new, 1)

          old = '''        trial_source: entitlement?.trial_source || null,\n        courtesy: courtesy'''
          new = '''        trial_source: entitlement?.trial_source || null,\n        pricing_cohort: pricingCohort,\n        legacy_full_access_until: legacyProtectionUntil,\n        pricing_review_due: pricingReviewDue,\n        courtesy: courtesy'''
          assert text.count(old) == 1, 'Unexpected return pricing fields anchor count'
          text = text.replace(old, new, 1)

          old = '''      access_active: records.filter((r) => r.access_active).length,\n      mrr_cents: Math.round(globalMrrCents),'''
          new = '''      access_active: records.filter((r) => r.access_active).length,\n      legacy_pricing: records.filter((r) => r.pricing_cohort === "legacy_pre_unification").length,\n      pricing_review_due: records.filter((r) => r.pricing_review_due).length,\n      mrr_cents: Math.round(globalMrrCents),'''
          assert text.count(old) == 1, 'Unexpected stats pricing anchor count'
          text = text.replace(old, new, 1)

          old = '''      else if (statusFilter === "trial_expired") filtered = filtered.filter((r) => r.trial_expired);\n      else if (stripeStatusFilters.has(statusFilter)) filtered = filtered.filter((r) => r.stripe_status === statusFilter);'''
          new = '''      else if (statusFilter === "trial_expired") filtered = filtered.filter((r) => r.trial_expired);\n      else if (statusFilter === "legacy_pricing") filtered = filtered.filter((r) => r.pricing_cohort === "legacy_pre_unification");\n      else if (statusFilter === "pricing_review_due") filtered = filtered.filter((r) => r.pricing_review_due);\n      else if (stripeStatusFilters.has(statusFilter)) filtered = filtered.filter((r) => r.stripe_status === statusFilter);'''
          assert text.count(old) == 1, 'Unexpected filter pricing anchor count'
          path.write_text(text.replace(old, new, 1))

          types = Path('src/pages/admin/types.ts')
          text = types.read_text()
          old = '''  trial_source?: "signup" | "migration" | null;\n  access_active?: boolean;'''
          new = '''  trial_source?: "signup" | "migration" | null;\n  pricing_cohort?: "current_unified" | "legacy_pre_unification" | null;\n  legacy_full_access_until?: string | null;\n  pricing_review_due?: boolean;\n  access_active?: boolean;'''
          assert text.count(old) == 1, 'Unexpected admin types record anchor count'
          text = text.replace(old, new, 1)
          old = '''  access_active?: number;\n  mrr_cents: number;'''
          new = '''  access_active?: number;\n  legacy_pricing?: number;\n  pricing_review_due?: number;\n  mrr_cents: number;'''
          assert text.count(old) == 1, 'Unexpected admin types stats anchor count'
          types.write_text(text.replace(old, new, 1))

          users = Path('src/pages/admin/AdminUsers.tsx')
          text = users.read_text()
          old = '''  trial_source?: "signup" | "migration" | null;\n  access_active?: boolean;'''
          new = '''  trial_source?: "signup" | "migration" | null;\n  pricing_cohort?: "current_unified" | "legacy_pre_unification" | null;\n  legacy_full_access_until?: string | null;\n  pricing_review_due?: boolean;\n  access_active?: boolean;'''
          assert text.count(old) == 1, 'Unexpected AdminUsers record anchor count'
          text = text.replace(old, new, 1)
          old = '''  access_active?: number;\n  mrr_cents: number;'''
          new = '''  access_active?: number;\n  legacy_pricing?: number;\n  pricing_review_due?: number;\n  mrr_cents: number;'''
          assert text.count(old) == 1, 'Unexpected AdminUsers stats anchor count'
          text = text.replace(old, new, 1)
          old = '''        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-9 gap-2 text-xs">'''
          new = '''        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-11 gap-2 text-xs">'''
          assert text.count(old) == 1, 'Unexpected AdminUsers stats grid anchor count'
          text = text.replace(old, new, 1)
          old = '''            { label: "Admins", value: stats.admin, color: "text-primary" },\n            { label: "MRR", value: fmtMoney(stats.mrr_cents, stats.currency), color: "text-emerald-600" },'''
          new = '''            { label: "Admins", value: stats.admin, color: "text-primary" },\n            { label: "Legado protegido", value: stats.legacy_pricing ?? 0, color: "text-violet-600" },\n            { label: "Revisar preço", value: stats.pricing_review_due ?? 0, color: "text-rose-600" },\n            { label: "MRR", value: fmtMoney(stats.mrr_cents, stats.currency), color: "text-emerald-600" },'''
          assert text.count(old) == 1, 'Unexpected AdminUsers stats cards anchor count'
          text = text.replace(old, new, 1)
          old = '''            <SelectItem value="trial_expired">Teste 7 dias expirado</SelectItem>\n            <SelectItem value="trialing">Trial Stripe</SelectItem>'''
          new = '''            <SelectItem value="trial_expired">Teste 7 dias expirado</SelectItem>\n            <SelectItem value="legacy_pricing">Preço legado protegido</SelectItem>\n            <SelectItem value="pricing_review_due">Revisão de preço pendente</SelectItem>\n            <SelectItem value="trialing">Trial Stripe</SelectItem>'''
          assert text.count(old) == 1, 'Unexpected AdminUsers filters anchor count'
          text = text.replace(old, new, 1)
          old = '''              <div>\n                <div className="text-xs text-muted-foreground">Fim assinatura</div>\n                <div>{user.subscription_end ? new Date(user.subscription_end).toLocaleDateString("pt-BR") : "—"}</div>\n              </div>'''
          new = '''              {user.pricing_cohort === "legacy_pre_unification" && (\n                <div className="p-3 rounded-md bg-violet-500/5 border border-violet-500/20">\n                  <div className="text-xs font-medium text-violet-600">Coorte comercial legada</div>\n                  <div className="text-xs text-muted-foreground mt-1">Acesso integral garantido por 6 meses após a unificação.</div>\n                  <div className="text-xs text-muted-foreground mt-1">\n                    Proteção até: {user.legacy_full_access_until ? new Date(user.legacy_full_access_until).toLocaleDateString("pt-BR") : "—"}\n                  </div>\n                  {user.pricing_review_due && (\n                    <Badge variant="outline" className="mt-2 bg-rose-500/10 text-rose-600 border-rose-500/20">Revisão de preço pendente</Badge>\n                  )}\n                </div>\n              )}\n              <div>\n                <div className="text-xs text-muted-foreground">Fim assinatura</div>\n                <div>{user.subscription_end ? new Date(user.subscription_end).toLocaleDateString("pt-BR") : "—"}</div>\n              </div>'''
          assert text.count(old) == 1, 'Unexpected AdminUsers detail anchor count'
          users.write_text(text.replace(old, new, 1))

      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected=$'src/pages/admin/AdminUsers.tsx\nsrc/pages/admin/types.ts\nsupabase/functions/admin-list-subscribers/index.ts'
          test "$changed" = "$expected"
          git diff --check
          grep -F 'legacy_pricing:' supabase/functions/admin-list-subscribers/index.ts
          grep -F 'pricing_review_due:' supabase/functions/admin-list-subscribers/index.ts
          grep -F 'Legado protegido' src/pages/admin/AdminUsers.tsx
          grep -F 'Revisão de preço pendente' src/pages/admin/AdminUsers.tsx

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/admin-list-subscribers/index.ts src/pages/admin/types.ts src/pages/admin/AdminUsers.tsx
          git commit -m "[admin-pricing-cohort] Sync legacy pricing protection with Admin"
          git push origin HEAD:audit/trial-entitlement-p0
