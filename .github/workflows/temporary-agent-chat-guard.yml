name: Temporary agent-chat entitlement patch

on:
  push:
    branches:
      - audit/trial-entitlement-p0

permissions:
  contents: write

jobs:
  patch-agent-chat:
    if: ${{ !contains(github.event.head_commit.message, '[agent-chat-guard]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/trial-entitlement-p0
          fetch-depth: 0

      - name: Apply surgical entitlement guard
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/functions/agent-chat/index.ts')
          text = path.read_text()

          old_import = 'import { createClient } from "https://esm.sh/@supabase/supabase-js@2";\n'
          new_import = old_import + 'import { resolveUserAccess, accessDeniedResponse } from "../_shared/access-control.ts";\n'
          assert text.count(old_import) == 1, 'Unexpected createClient import count'
          assert 'resolveUserAccess, accessDeniedResponse' not in text, 'Guard import already present'
          text = text.replace(old_import, new_import, 1)

          anchor = '    console.log(`Authenticated user: ${user.id}`);\n\n    // Rate limiting check (50 messages per hour)'
          replacement = '''    console.log(`Authenticated user: ${user.id}`);\n\n    // Commercial entitlement must be resolved before rate limiting or any AI cost.\n    const access = await resolveUserAccess(user);\n    if (!access.canUsePlatform) {\n      return accessDeniedResponse(access);\n    }\n\n    // Rate limiting check (50 messages per hour)'''
          assert text.count(anchor) == 1, 'Unexpected authentication anchor count'
          text = text.replace(anchor, replacement, 1)

          path.write_text(text)

      - name: Verify only agent-chat changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "supabase/functions/agent-chat/index.ts"
          git diff --check
          grep -F 'import { resolveUserAccess, accessDeniedResponse } from "../_shared/access-control.ts";' supabase/functions/agent-chat/index.ts
          grep -F 'const access = await resolveUserAccess(user);' supabase/functions/agent-chat/index.ts
          grep -F 'return accessDeniedResponse(access);' supabase/functions/agent-chat/index.ts

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/agent-chat/index.ts
          git commit -m "[agent-chat-guard] Enforce entitlement before AI usage"
          git push origin HEAD:audit/trial-entitlement-p0
